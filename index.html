<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Florence Insights | Data Analytics Platform</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #2ea043;
      --accent-hover: #3fb950;
      --primary: #58a6ff;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .main-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0 0 8px 0;
      font-size: 1.75rem;
      color: #ffffff;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .upload-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
    }
    input[type="file"] {
      background: var(--bg);
      border: 1px dashed var(--border);
      padding: 12px;
      border-radius: 6px;
      color: var(--text);
    }
    .btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 6px;
    }
    .metric-card span {
      font-size: 0.85rem;
      color: #8b949e;
    }
    .metric-card div {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 4px;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #21262d;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">⚡ Florence Insights</div>
  </div>
  
  <div class="main-content">
    <div class="header">
      <h1>Data Analytics Workspace</h1>
      <p>Upload a dataset to run high-performance DuckDB queries instantly.</p>
    </div>

    <div class="card">
      <div class="upload-box">
        <input type="file" id="fileInput" accept=".csv" />
        <button class="btn" onclick="processData()">Process Dataset</button>
      </div>
    </div>

    <div id="results" style="display: none;">
      <div class="metrics">
        <div class="metric-card">
          <span>Total Records</span>
          <div id="totalRows">0</div>
        </div>
        <div class="metric-card">
          <span>Total Columns</span>
          <div id="totalCols">0</div>
        </div>
      </div>

      <div class="card">
        <h3>Dataset Preview (First 10 Rows)</h3>
        <div class="table-container">
          <table id="previewTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function processData() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files[0]) {
        alert('Please select a CSV file first.');
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      const response = await fetch('/analyze', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (data.status === 'success') {
        document.getElementById('results').style.display = 'block';
        document.getElementById('totalRows').innerText = data.total_rows.toLocaleString();
        document.getElementById('totalCols').innerText = data.columns.length;

        // Render Table Headers
        const headRow = document.getElementById('tableHead');
        headRow.innerHTML = '';
        data.columns.forEach(col => {
          headRow.innerHTML += `<th>${col}</th>`;
        });

        // Render Table Body
        const body = document.getElementById('tableBody');
        body.innerHTML = '';
        data.preview.forEach(row => {
          let tr = '<tr>';
          data.columns.forEach(col => {
            tr += `<td>${row[col] ?? ''}</td>`;
          });
          tr += '</tr>';
          body.innerHTML += tr;
        });
      } else {
        alert('Error processing file: ' + data.message);
      }
    }
  </script>
</body>
</html>
