<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Florence Insights | Data Analytics Platform</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #2ea043;
      --accent-hover: #3fb950;
      --primary: #58a6ff;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    .brand-header {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .error-banner {
      background-color: #3d1f24;
      border: 1px solid #f85149;
      color: #ff7b72;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dismiss-btn {
      background: transparent;
      border: none;
      color: #ff7b72;
      font-size: 1.25rem;
      cursor: pointer;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0 0 8px 0;
      font-size: 1.75rem;
      color: #ffffff;
    }
    .header p {
      margin: 0;
      color: #8b949e;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .upload-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 100%;
    }
    input[type="file"] {
      background: var(--bg);
      border: 1px dashed var(--border);
      padding: 12px;
      border-radius: 6px;
      color: var(--text);
      width: 100%;
      box-sizing: border-box;
    }
    .btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 6px;
    }
    .metric-card span {
      font-size: 0.85rem;
      color: #8b949e;
    }
    .metric-card div {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 4px;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      background: #21262d;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="main-content">
    <div class="brand-header">⚡ Florence Insights</div>

    <div id="errorBanner" class="error-banner" style="display: none;">
      <span id="errorMessage">An error occurred.</span>
      <button onclick="dismissError()" class="dismiss-btn">&times;</button>
    </div>

    <div class="header">
      <h1>Data Analytics Workspace</h1>
      <p>Upload a dataset to run high-performance DuckDB queries instantly.</p>
    </div>

    <div class="card">
      <div class="upload-box">
        <input type="file" id="fileInput" accept=".csv" />
        <button class="btn" id="submitBtn" onclick="processData()">Process Dataset</button>
      </div>
    </div>

    <div id="results" style="display: none;">
      <div class="metrics">
        <div class="metric-card">
          <span>Total Records</span>
          <div id="totalRows">0</div>
        </div>
        <div class="metric-card">
          <span>Total Columns</span>
          <div id="totalCols">0</div>
        </div>
      </div>

      <div class="card">
        <h3>Dataset Preview (First 10 Rows)</h3>
        <div class="table-container">
          <table id="previewTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      document.getElementById('errorMessage').innerText = msg;
      banner.style.display = 'flex';
    }

    function dismissError() {
      document.getElementById('errorBanner').style.display = 'none';
    }

    async function processData() {
      dismissError();
      const fileInput = document.getElementById('fileInput');
      const submitBtn = document.getElementById('submitBtn');
      
      if (!fileInput.files[0]) {
        showError('Please select a CSV file first.');
        return;
      }

      submitBtn.innerText = 'Processing...';
      submitBtn.disabled = true;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.status === 'success') {
          document.getElementById('results').style.display = 'block';
          document.getElementById('totalRows').innerText = data.total_rows.toLocaleString();
          document.getElementById('totalCols').innerText = data.columns.length;

          // Render Headers
          const headRow = document.getElementById('tableHead');
          headRow.innerHTML = data.columns.map(col => `<th>${col}</th>`).join('');

          // Render Rows
          const body = document.getElementById('tableBody');
          body.innerHTML = data.preview.map(row => {
            const cells = data.columns.map(col => `<td>${row[col] !== undefined ? row[col] : ''}</td>`).join('');
            return `<tr>${cells}</tr>`;
          }).join('');
        } else {
          showError(data.message || 'Failed to process dataset.');
        }
      } catch (err) {
        showError('Network error or server failed to respond.');
      } finally {
        submitBtn.innerText = 'Process Dataset';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
