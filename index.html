<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Florence Insights | Data Analytics Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1c1c1f;
      --border: #2e2e32;
      --text: #ececed;
      --subtext: #8e8e93;
      --accent: #2c64e3;
      --accent-hover: #3fb950;
      --pill-bg: #18181b;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .main-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .plan-badge {
      background: #1a1a1e;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--subtext);
    }
    .plan-badge span {
      color: var(--accent);
      margin-left: 6px;
      font-weight: 500;
    }
    .hero-title {
      font-size: 2.2rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 28px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .prompt-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      margin-bottom: 24px;
    }
    .prompt-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      resize: none;
      box-sizing: border-box;
      min-height: 50px;
      font-family: inherit;
    }
    .prompt-input::placeholder {
      color: var(--subtext);
    }
    .prompt-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #28282c;
    }
    .left-tools {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .tool-icon {
      color: var(--subtext);
      cursor: pointer;
      font-size: 1.1rem;
      background: none;
      border: none;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .tool-icon:hover {
      color: var(--text);
    }
    .right-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .model-selector {
      font-size: 0.85rem;
      color: var(--subtext);
    }
    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .feature-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .pill {
      background: var(--pill-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill-tag {
      font-size: 0.65rem;
      color: var(--accent);
      font-weight: 700;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 16px;
    }
    .chart-box {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      background: #141416;
      color: #ffffff;
    }
    .hidden-file {
      display: none;
    }
  </style>
</head>
<body>

  <div class="main-content">
    
    <div class="top-bar">
      <div class="plan-badge">Free plan <span>Upgrade to get full powers</span></div>
    </div>

    <h1 class="hero-title">What can I do for you today?</h1>

    <!-- Julius Prompt Container -->
    <div class="prompt-container">
      <textarea id="userQuestion" class="prompt-input" placeholder="Create a report or ask a question about your dataset..."></textarea>
      
      <div class="prompt-actions">
        <div class="left-tools">
          <button class="tool-icon" onclick="document.getElementById('fileInput').click()" title="Upload CSV">+</button>
          <button class="tool-icon" title="Data Visualization">📊</button>
          <button class="tool-icon" title="Workspace">🖥️</button>
          <input type="file" id="fileInput" class="hidden-file" accept=".csv" onchange="processData()" />
        </div>
        
        <div class="right-tools">
          <span class="model-selector">Florence 1.0 Lite ▾</span>
          <button class="send-btn" id="askBtn" onclick="submitPrompt()">↑</button>
        </div>
      </div>
    </div>

    <!-- Feature Quick Pills -->
    <div class="feature-pills">
      <div class="pill"><span class="pill-tag">NEW</span> 🌐 Browser Agent</div>
      <div class="pill"><span class="pill-tag">NEW</span> 💻 Auto Clean</div>
      <div class="pill" onclick="document.getElementById('fileInput').click()">📊 Excel / CSV</div>
      <div class="pill"> More ▾</div>
    </div>

    <!-- Results Container -->
    <div id="results" style="display: none;">
      
      <!-- Interactive Analytics Dashboard Cards -->
      <div class="card">
        <h3>Analytics Dashboard</h3>
        <div class="charts-grid">
          <div class="chart-box">
            <h4 id="chart1Title" style="margin-top: 0; color: var(--subtext); font-weight: 500;">Distribution</h4>
            <canvas id="categoryChart"></canvas>
          </div>
          <div class="chart-box">
            <h4 id="chart2Title" style="margin-top: 0; color: var(--subtext); font-weight: 500;">Breakdown</h4>
            <canvas id="secondaryChart"></canvas>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 id="fileStatus" style="margin-top: 0;">Dataset Summary</h3>
        <div id="chatResult" style="color: #c9d1d9; font-family: monospace; white-space: pre-wrap;"></div>
      </div>

      <div class="card">
        <h3>Cleaned Data Preview (First 10 Rows)</h3>
        <div class="table-container">
          <table id="previewTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    let catChartInstance = null;
    let secChartInstance = null;

    async function processData() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      try {
        const response = await fetch('/analyze', { method: 'POST', body: formData });
        const data = await response.json();

        if (response.ok && data.status === 'success') {
          document.getElementById('results').style.display = 'block';
          document.getElementById('fileStatus').innerText = `Loaded: ${fileInput.files[0].name} (${data.total_rows.toLocaleString()} rows)`;

          // Table Headers & Rows
          document.getElementById('tableHead').innerHTML = data.columns.map(col => `<th>${col}</th>`).join('');
          document.getElementById('tableBody').innerHTML = data.preview.map(row => {
            const cells = data.columns.map(col => `<td>${row[col] !== undefined ? row[col] : ''}</td>`).join('');
            return `<tr>${cells}</tr>`;
          }).join('');

          // Render Dashboard Charts
          renderCharts(data.chart_data);
        }
      } catch (err) {
        alert('Error uploading or processing file.');
      }
    }

    function renderCharts(chartData) {
      document.getElementById('chart1Title').innerText = chartData.cat_title;
      document.getElementById('chart2Title').innerText = chartData.sec_title;

      // Bar Chart
      const ctx1 = document.getElementById('categoryChart').getContext('2d');
      if (catChartInstance) catChartInstance.destroy();
      catChartInstance = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: chartData.categories.labels,
          datasets: [{ data: chartData.categories.values, backgroundColor: '#2c64e3', borderRadius: 4 }]
        },
        options: { plugins: { legend: { display: false } }, responsive: true }
      });

      // Doughnut Chart
      const ctx2 = document.getElementById('secondaryChart').getContext('2d');
      if (secChartInstance) secChartInstance.destroy();
      secChartInstance = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: chartData.secondary.labels,
          datasets: [{ data: chartData.secondary.values, backgroundColor: ['#2c64e3', '#2ea043', '#3fb950', '#a371f7', '#f0883e'] }]
        },
        options: { plugins: { legend: { labels: { color: '#ececed' } } }, responsive: true }
      });
    }

    async function submitPrompt() {
      const questionInput = document.getElementById('userQuestion');
      const fileInput = document.getElementById('fileInput');

      if (!fileInput.files[0] && questionInput.value.trim() === '') {
        alert('Please attach a CSV file or enter a question.');
        return;
      }

      if (fileInput.files[0] && document.getElementById('results').style.display === 'none') {
        await processData();
      }

      if (questionInput.value.trim() !== '') {
        const formData = new FormData();
        formData.append('question', questionInput.value);

        try {
          const response = await fetch('/ask', { method: 'POST', body: formData });
          const data = await response.json();
          if (response.ok && data.status === 'success') {
            document.getElementById('results').style.display = 'block';
            document.getElementById('chatResult').innerText = data.result;
          }
        } catch (err) {
          alert('Failed to process prompt.');
        }
      }
    }
  </script>
</body>
      </html>
